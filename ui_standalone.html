            }

                font-size: 9vw;
            }
            label, select, input, button {
                font-size: inherit;
                margin-bottom: 4vw;

    <label for="dropdown">Wer bist du?</label>
    <select id="dropdown" name="dropdown"></select>
    <div id="confirmation" style="display:none; margin-top:10px;">
        <p>Bist du sicher?</p>
        <button id="yesBtn">Ja</button>
        <button id="noBtn">Nein</button>
    </div>
    <script>
        // People list (from people_data.json)
        const people = [
            "Lukas",
            "Ute",
            "Janne",
            "Diana",
            "Wiebke",
            "Sven",
            "Levke",
            "Abed"
        ];
        // Encoded allocation results (indices instead of names, base64 encoded JSON)
        // This is a string that looks like nonsense, but is just base64-encoded JSON
        const encodedAllocations = "eyJMdWthcyI6IFsiSmFubmUiLCAiU3ZlbiJdLCAiVXRlIjogWyJKYW5uZSIsICJBYmVkIl0sICJKYW5uZSI6IFsiTGV2a2UiLCAiV2llYmtlIl0sICJEaWFuYSI6IFsiV2llYmtlIiwgIlV0ZSJdLCAiV2llYmtlIjogWyJEaWFuYSIsICJVdGUiXSwgIlN2ZW4iOiBbIkRpYW5hIiwgIkx1a2FzIl0sICJMZXZrZSI6IFsiQWJlZCIsICJTdmVuIl0sICJBYmVkIjogWyJMdWthcyIsICJMZXZrZSJdfQ==";
        // Decode allocations
        function decodeAllocations(encoded, people) {
            // Decode base64
            const jsonStr = atob(encoded);
            // Parse JSON
            const raw = JSON.parse(jsonStr);
            // Map all values to arrays of names
            return Object.fromEntries(
                Object.entries(raw).map(([giver, receivers]) => [giver, receivers])
            );
        }
        const allocations = decodeAllocations(encodedAllocations, people);
        // Fill dropdown with a default option
        const dropdown = document.getElementById('dropdown');
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '-- bitte wählen --';
        defaultOption.selected = true;
        defaultOption.disabled = true;
        dropdown.appendChild(defaultOption);
        people.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            dropdown.appendChild(option);
        });
        const confirmation = document.getElementById('confirmation');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        dropdown.addEventListener('change', function() {
            if (dropdown.value) {
                confirmation.style.display = 'block';
            } else {
                confirmation.style.display = 'none';
            }
            // Remove previous result
            let resultDiv = document.getElementById('result');
            if (resultDiv) resultDiv.innerHTML = '';
        });
        noBtn.addEventListener('click', function() {
            dropdown.selectedIndex = 0; // Select default option
            confirmation.style.display = 'none';
            let resultDiv = document.getElementById('result');
            if (resultDiv) resultDiv.innerHTML = '';
        });
        yesBtn.addEventListener('click', function() {
            const selectedName = dropdown.value;
            const assigned = allocations[selectedName];
            let resultText = '';
            if (assigned && assigned.length === 2) {
                resultText = `${selectedName}, du beschenkst: <b>${assigned[0]}</b> und <b>${assigned[1]}</b>`;
            } else {
                resultText = 'Keine Zuteilung gefunden.';
            }
            let resultDiv = document.getElementById('result');
            if (!resultDiv) {
                resultDiv = document.createElement('div');
                resultDiv.id = 'result';
                confirmation.parentNode.insertBefore(resultDiv, confirmation.nextSibling);
            }
            resultDiv.innerHTML = resultText;
        });
    </script>
